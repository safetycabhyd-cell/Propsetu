<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prop Set U - Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6f9;
  color:#222;
}

.header{
  background:#063b66;
  color:white;
  padding:18px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:24px;
}

.header p{
  margin:6px 0 0;
  font-size:13px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:12px;
}

.card{
  background:white;
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h2{
  margin:0 0 14px;
  font-size:19px;
  color:#063b66;
}

label{
  display:block;
  font-weight:bold;
  font-size:13px;
  margin-top:11px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:14px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 16px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.save{
  width:100%;
  margin-top:16px;
  background:#159447;
  color:white;
}

.clear{
  width:100%;
  margin-top:8px;
  background:#777;
  color:white;
}

.property{
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  margin-top:12px;
}

.property h3{
  margin:0 0 7px;
  color:#063b66;
}

.property p{
  margin:5px 0;
  font-size:13px;
}

.delete{
  background:#d62828;
  color:white;
  margin-top:8px;
}

.edit{
  background:#e9a400;
  color:white;
  margin-top:8px;
  margin-right:5px;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#e7f7ec;
  color:#13843d;
  font-size:11px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#777;
  padding:15px;
}

.status{
  padding:10px;
  border-radius:8px;
  background:#eef5ff;
  color:#063b66;
  margin-bottom:12px;
  font-size:13px;
}

.footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:12px;
}
</style>
</head>

<body>

<div class="header">
  <h1>🏠 Prop Set U</h1>
  <p>Admin Property Management Panel</p>
</div>

<div class="container">

<div class="card">

<h2>➕ Add New Property</h2>

<div id="status" class="status">
Firebase connecting...
</div>

<label>Property Title</label>
<input id="title" placeholder="जैसे 3 BHK Independent House">

<label>Property Type</label>
<select id="type">
  <option value="Independent">Independent</option>
  <option value="Flat">Flat</option>
  <option value="Villa">Villa</option>
  <option value="Open Plot">Open Plot</option>
  <option value="Commercial">Commercial</option>
  <option value="Shop">Shop</option>
  <option value="Office">Office</option>
  <option value="PG">PG</option>
</select>

<label>Requirement</label>
<select id="requirement">
  <option value="Buy">Buy</option>
  <option value="Rent">Rent</option>
  <option value="Lease">Lease</option>
  <option value="Sell">Sell</option>
</select>

<label>Area / Location</label>
<input id="location" placeholder="जैसे Hyderabad">

<label>Price</label>
<input id="price" placeholder="जैसे ₹85 Lakh या ₹18,000 / Month">

<label>Bedrooms</label>
<input id="bedrooms" type="number" placeholder="जैसे 3">

<label>Property Area</label>
<input id="area" placeholder="जैसे 1500 Sq Ft">

<label>Owner / Agent Name</label>
<input id="owner" placeholder="Owner या Agent Name">

<label>Owner / Agent Mobile</label>
<input id="phone" type="tel" placeholder="10 digit mobile number">

<label>Property Description</label>
<textarea id="description"
placeholder="Property की पूरी जानकारी लिखें"></textarea>

<label>Property Image URL</label>
<input id="image" placeholder="Image URL">

<label>Property Video URL</label>
<input id="video" placeholder="YouTube / Video URL">

<button class="save" onclick="saveProperty()">
💾 Save Property
</button>

<button class="clear" onclick="clearForm()">
Clear Form
</button>

</div>


<div class="card">

<h2>🏘️ Property List</h2>

<div id="propertyList">
<div class="empty">Properties loading...</div>
</div>

</div>

</div>

<div class="footer">
Prop Set U © 2026<br>
Admin Panel
</div>


<!-- Firebase -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
   =====================================================

   यहाँ बाद में आपके Firebase Project का
   असली configuration आएगा.

   अभी इसे बदलना नहीं है.
   ===================================================== */

const firebaseConfig = {

  apiKey: "YOUR_API_KEY",

  authDomain: "YOUR_PROJECT.firebaseapp.com",

  projectId: "YOUR_PROJECT_ID",

  storageBucket: "YOUR_PROJECT.firebasestorage.app",

  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

  appId: "YOUR_APP_ID"

};


/* Firebase Start */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* Collection */

const propertiesRef =
collection(db,"properties");


let properties = [];

let editId = null;


/* Status */

function setStatus(message){

  document.getElementById("status").textContent =
  message;

}


/* Escape HTML */

function escapeHtml(text){

  return String(text || "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* Load Properties */

async function loadProperties(){

  try{

    setStatus("Properties loading...");

    const snapshot =
    await getDocs(propertiesRef);

    properties = [];

    snapshot.forEach((item)=>{

      properties.push({

        id:item.id,
        ...item.data()

      });

    });

    showProperties();

    setStatus(
      "✅ Firebase connected"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Firebase connection error"
    );

  }

}


/* Save Property */

window.saveProperty = async function(){

  const title =
  document.getElementById("title").value.trim();

  const type =
  document.getElementById("type").value;

  const requirement =
  document.getElementById("requirement").value;

  const location =
  document.getElementById("location").value.trim();

  const price =
  document.getElementById("price").value.trim();

  const bedrooms =
  document.getElementById("bedrooms").value.trim();

  const area =
  document.getElementById("area").value.trim();

  const owner =
  document.getElementById("owner").value.trim();

  const phone =
  document.getElementById("phone").value.trim();

  const description =
  document.getElementById("description").value.trim();

  const image =
  document.getElementById("image").value.trim();

  const video =
  document.getElementById("video").value.trim();


  if(!title || !location || !price){

    alert(
      "Property Title, Location और Price भरना जरूरी है."
    );

    return;

  }


  const property = {

    title:title,

    type:type,

    requirement:requirement,

    location:location,

    price:price,

    bedrooms:bedrooms,

    area:area,

    owner:owner,

    phone:phone,

    description:description,

    image:image,

    video:video,

    updatedAt:serverTimestamp()

  };


  try{

    setStatus("Saving property...");


    if(editId === null){

      property.createdAt =
      serverTimestamp();

      await addDoc(
        propertiesRef,
        property
      );

      alert(
        "✅ Property successfully added."
      );

    }else{

      await updateDoc(
        doc(db,"properties",editId),
        property
      );

      alert(
        "✅ Property successfully updated."
      );

      editId = null;

    }


    clearForm();

    await loadProperties();


  }catch(error){

    console.error(error);

    alert(
      "❌ Property save नहीं हुई."
    );

    setStatus(
      "❌ Firebase error"
    );

  }

};


/* Show Properties */

function showProperties(){

  const list =
  document.getElementById("propertyList");


  if(properties.length === 0){

    list.innerHTML =
    '<div class="empty">अभी कोई Property Added नहीं है.</div>';

    return;

  }


  list.innerHTML = "";


  properties.forEach((p)=>{

    const div =
    document.createElement("div");

    div.className =
    "property";


    div.innerHTML = `

      <h3>
      ${escapeHtml(p.title)}
      </h3>

      <span class="badge">
      ${escapeHtml(p.requirement)}
      </span>

      <p>
      🏠 <b>Type:</b>
      ${escapeHtml(p.type)}
      </p>

      <p>
      📍 <b>Location:</b>
      ${escapeHtml(p.location)}
      </p>

      <p>
      💰 <b>Price:</b>
      ${escapeHtml(p.price)}
      </p>

      ${
        p.bedrooms
        ?
        `<p>
        🛏️ <b>Bedrooms:</b>
        ${escapeHtml(p.bedrooms)}
        </p>`
        :
        ""
      }

      ${
        p.area
        ?
        `<p>
        📐 <b>Area:</b>
        ${escapeHtml(p.area)}
        </p>`
        :
        ""
      }

      ${
        p.owner
        ?
        `<p>
        👤 <b>Owner/Agent:</b>
        ${escapeHtml(p.owner)}
        </p>`
        :
        ""
      }

      ${
        p.phone
        ?
        `<p>
        📞 <b>Mobile:</b>
        ${escapeHtml(p.phone)}
        </p>`
        :
        ""
      }

      ${
        p.description
        ?
        `<p>
        📝 ${escapeHtml(p.description)}
        </p>`
        :
        ""
      }

      ${
        p.image
        ?
        `<p>
        🖼️ Image URL saved
        </p>`
        :
        ""
      }

      ${
        p.video
        ?
        `<p>
        🎥 Video URL saved
        </p>`
        :
        ""
      }

      <button
      class="edit"
      onclick="editProperty('${p.id}')">
      ✏️ Edit
      </button>

      <button
      class="delete"
      onclick="deleteProperty('${p.id}')">
      🗑️ Delete
      </button>

    `;


    list.appendChild(div);

  });

}


/* Edit Property */

window.editProperty = function(id){

  const p =
  properties.find(
    item => item.id === id
  );


  if(!p) return;


  document.getElementById("title").value =
  p.title || "";

  document.getElementById("type").value =
  p.type || "Independent";

  document.getElementById("requirement").value =
  p.requirement || "Buy";

  document.getElementById("location").value =
  p.location || "";

  document.getElementById("price").value =
  p.price || "";

  document.getElementById("bedrooms").value =
  p.bedrooms || "";

  document.getElementById("area").value =
  p.area || "";

  document.getElementById("owner").value =
  p.owner || "";

  document.getElementById("phone").value =
  p.phone || "";

  document.getElementById("description").value =
  p.description || "";

  document.getElementById("image").value =
  p.image || "";

  document.getElementById("video").value =
  p.video || "";


  editId = id;


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

};


/* Delete Property */

window.deleteProperty = async function(id){

  if(
    !confirm(
      "क्या आप यह Property Delete करना चाहते हैं?"
    )
  ){

    return;

  }


  try{

    setStatus(
      "Deleting property..."
    );


    await deleteDoc(
      doc(db,"properties",id)
    );


    alert(
      "🗑️ Property deleted."
    );


    await loadProperties();


  }catch(error){

    console.error(error);

    alert(
      "❌ Property delete नहीं हुई."
    );

  }

};


/* Clear Form */

window.clearForm = function(){

  document.getElementById("title").value = "";

  document.getElementById("location").value = "";

  document.getElementById("price").value = "";

  document.getElementById("bedrooms").value = "";

  document.getElementById("area").value = "";

  document.getElementById("owner").value = "";

  document.getElementById("phone").value = "";

  document.getElementById("description").value = "";

  document.getElementById("image").value = "";

  document.getElementById("video").value = "";


  document.getElementById("type").selectedIndex = 0;

  document.getElementById("requirement").selectedIndex = 0;


  editId = null;

};


/* Start */

loadProperties();

</script>

</body>
</html>
